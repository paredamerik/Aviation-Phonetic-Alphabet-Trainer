name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies and PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # 4. Run PyInstaller to build the .exe using your exact file names
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=app_icon.ico alpha_trainer.py

# 5. Handle release and upload safely without modifying protected tags
      - name: Create Release and Upload Asset via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
          Write-Host "Target tag: $tagName"

          # 1. If a release was already auto-created by GitHub for this tag, delete just the release (not the tag)
          gh release delete "$tagName" --yes --cleanup-tag=false 2>$null

          # 2. Create the release as a draft
          Write-Host "Creating draft release..."
          gh release create "$tagName" --draft --title "Release $tagName" --notes "Automated build for alpha_trainer.exe"

          # 3. Upload the .exe asset
          Write-Host "Uploading executable asset..."
          gh release upload "$tagName" dist/alpha_trainer.exe --clobber

          # 4. Publish the release
          Write-Host "Publishing release..."
          gh release edit "$tagName" --draft=$false