name: Build Executable

# Trigger this workflow whenever you publish a new GitHub Release
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Choose your Python version
          cache: 'pip'

      # 3. Install dependencies and PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # 4. Run PyInstaller to build the .exe
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=icon.png myscript.py
          # Note: Adjust 'myscript.py' and '--icon' paths to match your project structure

      # 5. Upload the built .exe to the GitHub Release assets
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/myscript.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
