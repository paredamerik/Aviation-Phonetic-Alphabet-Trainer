name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies and PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # 4. Run PyInstaller to build the .exe using your exact file names
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=app_icon.ico alpha_trainer.py

# 5. Attach asset to the existing tag release safely
      - name: Upload Asset to Release via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
          Write-Host "Target tag: $tagName"

          # Instead of creating a new release (which triggers immutable errors), 
          # find the release ID automatically created for this tag and upload the asset directly to it.
          
          Write-Host "Waiting for GitHub release wrapper to stabilize..."
          Start-Sleep -Seconds 3

          # Upload directly to the tag reference using gh release upload
          Write-Host "Uploading executable asset..."
          gh release upload "$tagName" dist/alpha_trainer.exe --clobber