name: Build Executable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=app_icon.ico alpha_trainer.py

      - name: Create Unique Tag, Draft Release, and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Generate a 100% unique timestamp-based version tag automatically
          $tagName = "v" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          Write-Host "Generated Unique Target Tag: $tagName"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Push the fresh unique tag
          git tag "$tagName"
          git push origin "$tagName"

          # Create draft release
          Write-Host "Creating draft release wrapper..."
          gh release create "$tagName" --draft --title "Release $tagName" --notes "Automated build for alpha_trainer.exe"

          # Upload asset safely while in draft
          Write-Host "Uploading executable asset..."
          gh release upload "$tagName" dist/alpha_trainer.exe --clobber

          # Publish release
          Write-Host "Publishing final release..."
          gh release edit "$tagName" --draft=$false