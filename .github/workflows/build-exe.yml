name: Build Executable

# Triggers when you publish a new GitHub Release or want to test manually
on:
  release:
    types: [published]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies and PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # 4. Run PyInstaller to build the .exe using your exact file names
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=app_icon.ico alpha_trainer.py

      # 5. Upload the built .exe to the GitHub Release assets (with explicit tag name)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/alpha_trainer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}