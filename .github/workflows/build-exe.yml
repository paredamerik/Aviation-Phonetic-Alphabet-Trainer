name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install dependencies and PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      # 4. Run PyInstaller to build the .exe using your exact file names
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=app_icon.ico alpha_trainer.py

      # 5. Create release safely via GitHub CLI (Draft -> Upload -> Publish)
      - name: Upload Release Asset via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF.Replace('refs/tags/', '')
          Write-Host "Creating draft release for tag: $tagName"
          
          # Step A: Create release as a draft first (bypasses immutable lock)
          gh release create "$tagName" --draft --title "Release $tagName" --notes "Automated build for alpha_trainer.exe"
          
          # Step B: Attach the executable file to the draft release
          Write-Host "Uploading asset..."
          gh release upload "$tagName" dist/alpha_trainer.exe --clobber
          
          # Step C: Publish the release
          Write-Host "Publishing release..."
          gh release edit "$tagName" --draft=$false